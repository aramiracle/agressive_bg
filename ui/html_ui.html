<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Backgammon AI — Neural Client</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="app">

  <!-- HEADER: brand, mode, model, connection -->
  <header class="panel topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span class="brand-pip"></span><span class="brand-pip"></span>
      </div>
      <div class="brand-text">
        <h1>Backgammon <span>AI</span></h1>
        <p>Neural client</p>
      </div>
    </div>

    <div class="topbar-controls">
      <div class="field">
        <label for="aiMode">Mode</label>
        <select id="aiMode">
          <option value="human_vs_ai">Human vs AI</option>
          <option value="ai_vs_human">AI vs Human</option>
          <option value="ai_vs_ai">AI vs AI</option>
        </select>
      </div>

      <div class="model-box">
        <button id="btnLoadModel" class="btn-ghost">Load Model</button>
        <input type="file" id="modelFile" accept=".pt,.pth" hidden>
        <span id="modelStatus" class="model-status" title="No model loaded">No model</span>
      </div>

      <div class="connection disconnected" id="connStatus">Disconnected</div>
    </div>
  </header>

  <!-- SCOREBOARD: players, match target, cube -->
  <section class="panel scoreboard">
    <div class="player-card player-white" id="cardWhite">
      <div class="player-chip white" aria-hidden="true"></div>
      <div class="player-meta">
        <span class="player-name">White</span>
        <span class="pip-display">Pips <span id="pipsWhite">167</span></span>
      </div>
      <div class="score-value" id="scoreWhite">0</div>
    </div>

    <div class="match-info">
      <div class="match-target">
        <label for="matchTargetSelect">Match to</label>
        <select id="matchTargetSelect">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="7" selected>7</option>
          <option value="9">9</option>
          <option value="11">11</option>
          <option value="15">15</option>
          <option value="21">21</option>
        </select>
      </div>
      <div class="crawford-indicator is-hidden" id="crawfordIndicator">Crawford</div>
      <div class="match-buttons">
        <button class="btn-new" id="btnNewMatch">New Match</button>
        <button id="btnNew">New Game</button>
      </div>
    </div>

    <div class="player-card player-black" id="cardBlack">
      <div class="score-value" id="scoreBlack">0</div>
      <div class="player-meta">
        <span class="player-name">Black</span>
        <span class="pip-display">Pips <span id="pipsBlack">167</span></span>
      </div>
      <div class="player-chip black" aria-hidden="true"></div>
    </div>
  </section>

  <!-- TABLE: off counts, cube, dice -->
  <section class="panel info">
    <div class="off-display">
      <div class="off-count" id="offBlack">0</div>
      <div class="off-label">Black Off</div>
    </div>

    <div class="cube-display">
      <div class="cube-box" id="cubeBox">
        <div class="cube-value" id="cubeValue">1</div>
      </div>
      <div class="cube-owner" id="cubeOwner">Center</div>
    </div>

    <div class="dice">
      <div class="die" id="die1">-</div>
      <div class="die" id="die2">-</div>
      <div class="die is-hidden" id="die3">-</div>
      <div class="die is-hidden" id="die4">-</div>
    </div>

    <div class="off-display">
      <div class="off-count" id="offWhite">0</div>
      <div class="off-label">White Off</div>
    </div>
  </section>

  <!-- STATUS -->
  <div class="panel status" id="status" role="status" aria-live="polite">Connecting to AI...</div>

  <!-- BOARD -->
  <main class="board-wrapper">
    <div class="board">
      <!-- Top row: points 13-24 -->
      <div class="points" id="topLeft"></div>
      <div class="bar">
        <div class="bar-section" id="barBlack" data-player="-1"></div>
      </div>
      <div class="points" id="topRight"></div>

      <!-- Middle row: point numbers -->
      <div class="middle-row" id="midLeft"></div>
      <div class="middle-row"></div>
      <div class="middle-row" id="midRight"></div>

      <!-- Bottom row: points 12-1 -->
      <div class="points" id="bottomLeft"></div>
      <div class="bar">
        <div class="bar-section" id="barWhite" data-player="1"></div>
      </div>
      <div class="points" id="bottomRight"></div>
    </div>

    <!-- Bear-off trays -->
    <aside class="bearoff">
      <div class="bearoff-section" id="bearoffBlack" data-player="-1">
        <div class="bearoff-stack" id="bearoffBlackStack"></div>
        <div class="bearoff-count" id="bearoffBlackCount">0</div>
        <div class="bearoff-label">Black</div>
      </div>
      <div class="bearoff-section" id="bearoffWhite" data-player="1">
        <div class="bearoff-stack" id="bearoffWhiteStack"></div>
        <div class="bearoff-count" id="bearoffWhiteCount">0</div>
        <div class="bearoff-label">White</div>
      </div>
    </aside>
  </main>

  <!-- ACTIONS -->
  <section class="panel actions">
    <button class="btn-roll" id="btnRoll">Roll Dice</button>
    <button class="btn-gold" id="btnDouble">Double</button>
    <button id="btnEnd">End Turn</button>
    <button class="is-hidden" id="btnAI">Step AI</button>
    <button class="is-hidden" id="btnAutoplay">▶ Autoplay</button>
    <select class="is-hidden" id="autoplaySpeed">
      <option value="0.5">Fast (0.5s)</option>
      <option value="1" selected>Normal (1s)</option>
      <option value="2">Slow (2s)</option>
      <option value="3">Very Slow (3s)</option>
    </select>
  </section>

  <footer class="shortcuts">
    <span><kbd>R</kbd> Roll</span>
    <span><kbd>E</kbd> End turn</span>
    <span><kbd>N</kbd> New game</span>
    <span><kbd>S</kbd> Step AI</span>
    <span><kbd>Space</kbd> Autoplay</span>
    <span><kbd>Esc</kbd> Cancel</span>
  </footer>
</div>

<!-- CUBE DECISION MODAL -->
<div id="cubeOverlay" class="cube-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="cubePrompt">
  <div class="cube-dialog">
    <div class="cube-dialog-icon" aria-hidden="true">×2</div>
    <h2 id="cubePrompt">Double Offered!</h2>
    <div class="cube-dialog-buttons">
      <button id="btnTake" class="btn-roll btn-lg">Take</button>
      <button id="btnPass" class="btn-new btn-lg">Pass</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
